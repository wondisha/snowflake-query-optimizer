name: Tests & Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint flake8

      - name: Lint with flake8
        run: |
          # Stop on syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on other issues
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Security check with bandit
        run: |
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t snowflake-optimizer:test .

      - name: Verify image
        run: docker images | grep snowflake-optimizer

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check requirements
        run: |
          if [ ! -f requirements.txt ]; then
            echo "requirements.txt missing!"
            exit 1
          fi

      - name: Verify documentation
        run: |
          required_files=("README.md" "SECURITY.md" "CHANGELOG.md" "LICENSE" "Dockerfile" "docker-compose.yml")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing $file"
              exit 1
            fi
          done
          echo "✅ All required files present"
